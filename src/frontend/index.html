<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassifiedAds - Buy & Sell Anything</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <h1>🏪 ClassifiedAds</h1>
                <p>Buy & Sell Anything</p>
            </div>
            <div class="header-buttons">
                <button class="btn btn-primary" onclick="openModal('login-modal')">Login</button>
                <button class="btn btn-secondary" onclick="openModal('register-modal')">Register</button>
                <button class="btn btn-success" onclick="openModal('sell-modal')">+ Sell</button>
            </div>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="container">
            <h2>Find Great Deals on Everything</h2>
            <div class="search-box">
                <input type="text" id="search" placeholder="Search listings..." autocomplete="off">
                <select id="category">
                    <option value="">All Categories</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Furniture">Furniture</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Books">Books</option>
                    <option value="Sports">Sports</option>
                    <option value="Toys">Toys</option>
                    <option value="Home">Home</option>
                </select>
                <button class="btn btn-search" onclick="filterListings()">Search</button>
            </div>
        </div>
    </section>

    <!-- SORT & FILTERS -->
    <section class="filters">
        <div class="container">
            <div class="sort-options">
                <label>Sort by:</label>
                <select id="sort" onchange="filterListings()">
                    <option value="newest">Newest</option>
                    <option value="price_low">Price: Low to High</option>
                    <option value="price_high">Price: High to Low</option>
                </select>
            </div>
        </div>
    </section>

    <!-- LISTINGS GRID -->
    <section class="listings">
        <div class="container">
            <div class="listings-grid" id="listings-container">
                <div class="loading">Loading listings...</div>
            </div>
        </div>
    </section>

    <!-- PAGINATION -->
    <section class="pagination-section">
        <div class="container">
            <div id="pagination" class="pagination"></div>
        </div>
    </section>

    <!-- LISTING DETAIL MODAL -->
    <div id="detail-modal" class="modal">
        <div class="modal-content modal-large">
            <button class="close-btn" onclick="closeModal('detail-modal')">&times;</button>
            <div class="listing-detail" id="listing-detail"></div>
        </div>
    </div>

    <!-- LOGIN MODAL -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('login-modal')">&times;</button>
            <h3>Login</h3>
            <form onsubmit="handleLogin(event)">
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        </div>
    </div>

    <!-- REGISTER MODAL -->
    <div id="register-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('register-modal')">&times;</button>
            <h3>Register</h3>
            <form onsubmit="handleRegister(event)">
                <input type="text" placeholder="Username" required>
                <input type="email" placeholder="Email" required>
                <input type="text" placeholder="Full Name" required>
                <input type="password" placeholder="Password" required>
                <button type="submit" class="btn btn-primary">Register</button>
            </form>
        </div>
    </div>

    <!-- SELL MODAL -->
    <div id="sell-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('sell-modal')">&times;</button>
            <h3>Create Listing</h3>
            <form onsubmit="handleCreateListing(event)">
                <input type="text" placeholder="Title" required>
                <textarea placeholder="Description" rows="4" required></textarea>
                <select required>
                    <option value="">Select Category</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Furniture">Furniture</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Books">Books</option>
                    <option value="Sports">Sports</option>
                    <option value="Toys">Toys</option>
                    <option value="Home">Home</option>
                </select>
                <input type="number" placeholder="Price" step="0.01" required>
                <input type="text" placeholder="Location" required>
                <select>
                    <option value="">Condition</option>
                    <option value="new">New</option>
                    <option value="like_new">Like New</option>
                    <option value="good">Good</option>
                    <option value="fair">Fair</option>
                </select>
                <button type="submit" class="btn btn-success">List Item</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 ClassifiedAds. Buy & Sell with Confidence.</p>
            <div class="footer-links">
                <a href="#">About</a> | <a href="#">Contact</a> | <a href="#">Terms</a> | <a href="#">Privacy</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
